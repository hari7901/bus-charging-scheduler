metadata:
  id: scenario_05
  name: "Scenario 5 — Worst Case Convergence"
  description: >
    All 20 buses dispatched within a 72-minute window (every 8 min) from
    both ends simultaneously. By the time buses reach inner stations B and C,
    they collide from both directions. Maximum charger contention scenario.

parameters:
  battery_range_km: 240
  charge_duration_min: 25
  speed_kmh: 60
  time_rounding: ceil

route:
  nodes:
    - id: bengaluru
      name: "Bengaluru"
    - id: A
      name: "Station A"
    - id: B
      name: "Station B"
    - id: C
      name: "Station C"
    - id: D
      name: "Station D"
    - id: kochi
      name: "Kochi"
  segments:
    - from: bengaluru
      to: A
      distance_km: 100
    - from: A
      to: B
      distance_km: 120
    - from: B
      to: C
      distance_km: 100
    - from: C
      to: D
      distance_km: 120
    - from: D
      to: kochi
      distance_km: 100

stations:
  - id: A
    name: "Station A"
    charger_count: 1
  - id: B
    name: "Station B"
    charger_count: 1
  - id: C
    name: "Station C"
    charger_count: 1
  - id: D
    name: "Station D"
    charger_count: 1

operators:

metadata:
  id: scenario_03
  name: "Scenario 3 — Asymmetric Load"
  description: >
    10 buses going Bengaluru→Kochi (15-min spacing), only 4 going
    Kochi→Bengaluru. Tests how the scheduler handles uneven traffic
    across directions. Total bus count is 14, not 20.

parameters:
  battery_range_km: 240
  charge_duration_min: 25
  speed_kmh: 60
  time_rounding: ceil

route:
  nodes:
    - id: bengaluru
      name: "Bengaluru"
    - id: A
      name: "Station A"
    - id: B
      name: "Station B"
    - id: C
      name: "Station C"
    - id: D
      name: "Station D"
    - id: kochi
      name: "Kochi"
  segments:
    - from: bengaluru
      to: A
      distance_km: 100
    - from: A
      to: B
      distance_km: 120
    - from: B
      to: C
      distance_km: 100
    - from: C
      to: D
      distance_km: 120
    - from: D
      to: kochi
      distance_km: 100

stations:
  - id: A
    name: "Station A"
    charger_count: 1
  - id: B
    name: "Station B"
    charger_count: 1
  - id: C
    name: "Station C"
    charger_count: 1
  - id: D
    name: "Station D"
    charger_count: 1

operators:
  - id: kpn
    name: "KPN"
  - id: freshbus
    name: "Freshbus"
  - id: flixbus
    name: "Flixbus"

weights:
  individual: 1.0
  operator: 1.0
  overall: 1.0

buses:

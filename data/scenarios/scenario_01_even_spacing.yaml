metadata:
  id: scenario_01
  name: "Scenario 1 — Even Spacing"
  description: >
    Buses depart every 15 minutes in each direction starting 19:00.
    Baseline case with predictable, evenly spaced contention.

parameters:
  battery_range_km: 240
  charge_duration_min: 25
  speed_kmh: 60
  # fractional travel times are rounded UP to the nearest minute (conservative)
  time_rounding: ceil

route:
  # Ordered list of all nodes; direction determines traversal order
  nodes:
    - id: bengaluru
      name: "Bengaluru"
    - id: A
      name: "Station A"
    - id: B
      name: "Station B"
    - id: C
      name: "Station C"
    - id: D
      name: "Station D"
    - id: kochi
      name: "Kochi"
  segments:
    # Each segment connects adjacent nodes in the ordered list above
    - from: bengaluru
      to: A
      distance_km: 100
    - from: A
      to: B
      distance_km: 120
    - from: B
      to: C
      distance_km: 100
    - from: C
      to: D
      distance_km: 120
    - from: D
      to: kochi
      distance_km: 100

stations:
  # Only intermediate stations are scheduling stations;
  # endpoints (bengaluru, kochi) are slow chargers not modelled here.
  - id: A
    name: "Station A"
    charger_count: 1
    # charge_duration_min inherits from parameters if not set
  - id: B
    name: "Station B"
    charger_count: 1
  - id: C
    name: "Station C"
    charger_count: 1
  - id: D
    name: "Station D"
    charger_count: 1

operators:
  - id: kpn
    name: "KPN"
  - id: freshbus
    name: "Freshbus"
  - id: flixbus
    name: "Flixbus"

weights:
  individual: 1.0   # penalise maximum single-bus wait
  operator: 1.0     # penalise worst operator fleet wait (normalised by fleet size)
  overall: 1.0      # penalise total delay across all buses

buses:
  - id: bus-BK-01
    operator: kpn
    origin: bengaluru
    destination: kochi
    departure: "19:00"
  - id: bus-BK-02
    operator: freshbus
    origin: bengaluru
    destination: kochi
    departure: "19:15"
  - id: bus-BK-03
    operator: flixbus
    origin: bengaluru
    destination: kochi
    departure: "19:30"
